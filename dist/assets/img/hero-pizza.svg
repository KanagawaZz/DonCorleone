<!-- hero-pizza.svg — Pizza ilustrada (vista superior) usada como alternativa estática do hero e enquanto a cena 3D carrega. Substitua por uma foto (hero-pizza.webp) quando disponível e atualize config.js. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Pizza artesanal de calabresa">
  <defs>
    <radialGradient id="crust" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e0a45f"/><stop offset=".7" stop-color="#b8782f"/><stop offset="1" stop-color="#6b3a14"/></radialGradient>
    <radialGradient id="sauce" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b3281a"/><stop offset="1" stop-color="#8a1a10"/></radialGradient>
    <radialGradient id="cheese" cx=".42" cy=".38" r=".75"><stop offset="0" stop-color="#f6dc9b"/><stop offset=".75" stop-color="#e8bd68"/><stop offset="1" stop-color="#c98d34"/></radialGradient>
    <radialGradient id="pep" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#b13a24"/><stop offset=".8" stop-color="#8c2a1b"/><stop offset="1" stop-color="#5a180d"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <g id="p"><circle r="36" fill="url(#pep)"/><circle r="36" fill="none" stroke="#3d0f07" stroke-width="3" opacity=".6"/><circle cx="-10" cy="-8" r="5" fill="#d0583a" opacity=".5"/><circle cx="12" cy="9" r="4" fill="#3d0f07" opacity=".45"/><circle cx="8" cy="-14" r="3" fill="#3d0f07" opacity=".35"/></g>
    <path id="leaf" d="M0 0 C 14 -22 40 -22 52 0 C 40 22 14 22 0 0Z" fill="#2f5d2a" stroke="#1d3e1a" stroke-width="2"/>
  </defs>
  <ellipse cx="300" cy="312" rx="290" ry="290" fill="url(#glow)"/>
  <circle cx="300" cy="300" r="270" fill="url(#crust)"/>
  <circle cx="300" cy="300" r="270" fill="none" stroke="#4a2410" stroke-width="5" opacity=".5"/>
  <g fill="#5a2f12" opacity=".5"><circle cx="120" cy="190" r="10"/><circle cx="470" cy="150" r="8"/><circle cx="500" cy="420" r="11"/><circle cx="170" cy="480" r="9"/><circle cx="330" cy="545" r="7"/></g>
  <circle cx="300" cy="300" r="232" fill="url(#sauce)"/>
  <path d="M300 74 C 420 70 520 150 524 290 C 530 420 430 520 300 524 C 170 528 76 430 76 300 C 72 170 170 78 300 74Z" fill="url(#cheese)"/>
  <g fill="#f8e6b8" opacity=".55" filter="url(#soft)"><circle cx="230" cy="150" r="24"/><circle cx="400" cy="220" r="30"/><circle cx="210" cy="380" r="28"/><circle cx="380" cy="420" r="22"/></g>
  <g fill="#c78a2e" opacity=".5" filter="url(#soft)"><circle cx="150" cy="300" r="16"/><circle cx="470" cy="310" r="18"/><circle cx="300" cy="490" r="14"/></g>
  <use href="#p" transform="translate(300 130) scale(1)"/><use href="#p" transform="translate(410 170) rotate(40) scale(.95)"/>
  <use href="#p" transform="translate(190 190) rotate(80) scale(1.02)"/><use href="#p" transform="translate(470 300) rotate(20) scale(.97)"/>
  <use href="#p" transform="translate(330 270) rotate(120) scale(1.05)"/><use href="#p" transform="translate(135 305) rotate(10) scale(.95)"/>
  <use href="#p" transform="translate(235 335) rotate(60) scale(1)"/><use href="#p" transform="translate(425 410) rotate(100) scale(1)"/>
