  <use href="#leaf" transform="translate(260 240) rotate(-30)"/><use href="#leaf" transform="translate(380 345) rotate(60)"/>
  <use href="#leaf" transform="translate(360 190) rotate(15) scale(.8)"/><use href="#leaf" transform="translate(250 395) rotate(140) scale(.9)"/>
  <use href="#leaf" transform="translate(445 235) rotate(-70) scale(.8)"/>
