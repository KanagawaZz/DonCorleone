<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="seloGold" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF3CC" />
      <stop offset="45%" stop-color="#F7BA2A" />
      <stop offset="85%" stop-color="#C48416" />
      <stop offset="100%" stop-color="#8A5508" />
    </radialGradient>
    <radialGradient id="seloRed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#D94336" />
      <stop offset="70%" stop-color="#9C221A" />
      <stop offset="100%" stop-color="#5E110C" />
    </radialGradient>
    <filter id="seloShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Wax seal outer scallop -->
  <g filter="url(#seloShadow)">
    <circle cx="60" cy="60" r="52" fill="url(#seloRed)" stroke="url(#seloGold)" stroke-width="1.5" />
    <circle cx="60" cy="60" r="44" fill="none" stroke="url(#seloGold)" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.85" />
    <!-- Monogram DC -->
    <text x="60" y="68" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="700" fill="url(#seloGold)" text-anchor="middle" letter-spacing="1">DC</text>
    <!-- Little star at top -->
    <polygon points="60,25 61.5,28.5 65,29 62.5,31.5 63,35 60,33 57,35 57.5,31.5 55,29 58.5,28.5" fill="url(#seloGold)" />
  </g>
</svg>
