<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 90" width="500" height="90">
  <defs>
    <linearGradient id="wordmarkGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F7BA2A" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
  </defs>
  <!-- Main brand name -->
  <text x="250" y="48" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="700" fill="url(#wordmarkGold)" text-anchor="middle" letter-spacing="6">
    DON CORLEONE
  </text>
  <!-- Decorative thin line divider -->
  <line x1="80" y1="62" x2="200" y2="62" stroke="url(#wordmarkGold)" stroke-width="0.8" opacity="0.6" />
  <circle cx="250" cy="62" r="2.5" fill="url(#wordmarkGold)" />
  <line x1="300" y1="62" x2="420" y2="62" stroke="url(#wordmarkGold)" stroke-width="0.8" opacity="0.6" />
  <!-- Descriptor -->
  <text x="250" y="78" font-family="'Manrope', 'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#EAD9BD" text-anchor="middle" letter-spacing="8">
    PIZZAS E ESFIHAS
  </text>
</svg>
