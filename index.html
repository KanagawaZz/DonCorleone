<!doctype html>
<!--
  index.html — Estrutura semântica e pontos de montagem. Sem CSS/JS embutidos.
  Textos vêm de js/config.js (data-cfg="caminho.no.config"); título, descrição e Open Graph são injetados no build.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="theme-color" content="#0d0a09" />
    <!--SEO_TAGS-->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/cardapio.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#cardapio">Ir para o cardápio</a>

    <header class="nav" id="nav">
      <div class="nav__inner container">
        <a class="nav__brand" href="#inicio" aria-label="DonCorleone — início">
          <img src="%LOGO%" width="44" height="44" alt="" data-brand-logo />
          <span class="nav__name" data-cfg="identidade.nome"></span>
        </a>
        <nav class="nav__links" aria-label="Principal">
          <a href="#pizza">A pizza</a>
          <a href="#cardapio">Cardápio</a>
          <a href="#casa">A casa</a>
          <a href="#pedido">Contato</a>
        </nav>
        <a class="btn btn--gold btn--sm" data-order href="#pedido">Pedir</a>
      </div>
    </header>

    <!-- Camada fixa da cena 3D (criada por js/pizza3d.js). Decorativa. -->
    <div class="stage-canvas" id="stage-canvas" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <main id="conteudo">
      <!-- CENA 1 — Abertura -->
      <section class="hero" id="inicio" aria-labelledby="hero-title">
        <div class="hero__inner container">
          <div class="hero__copy">
            <p class="eyebrow" data-hero-reveal data-cfg="identidade.hero.selo"></p>
            <h1 class="hero__title" id="hero-title" data-hero-title data-cfg="identidade.hero.titulo"></h1>
            <p class="hero__sub" data-hero-reveal data-cfg="identidade.hero.subtitulo"></p>
            <div class="hero__cta" data-hero-reveal>
              <a class="btn btn--gold" href="#cardapio" data-cfg="identidade.hero.ctaPrimario"></a>
              <a class="btn btn--ghost" data-order href="#pedido" data-cfg="identidade.hero.ctaSecundario"></a>
            </div>
          </div>
          <div class="hero__stage" data-pizza-anchor>
            <div class="smoke" aria-hidden="true"><span></span><span></span><span></span></div>
            <img class="hero__fallback" src="%HERO_IMG%" width="600" height="600" alt="Pizza artesanal de calabresa saindo do forno" fetchpriority="high" decoding="async" />
          </div>
        </div>
        <a class="hero__hint" href="#assinatura" aria-label="Rolar para a próxima seção"><span></span></a>
      </section>

      <!-- CENA 2 — Assinatura da casa -->
      <section class="signature" id="assinatura" aria-labelledby="sig-title">
        <div class="container signature__inner">
          <div class="signature__copy" data-reveal>
            <p class="kicker"><span data-cfg="identidade.assinatura.numero"></span><i></i><span data-cfg="identidade.assinatura.rotulo"></span></p>
            <h2 class="signature__quote" id="sig-title" data-cfg="identidade.assinatura.frase"></h2>
            <p class="signature__text" data-cfg="identidade.assinatura.texto"></p>
          </div>
        </div>
      </section>

      <!-- CENA 3 — Pizza em destaque (camadas) -->
      <section class="stage" id="pizza" aria-labelledby="stage-title">
        <div class="stage__pin">
          <div class="container stage__inner">
            <div class="stage__copy">
              <p class="kicker"><span data-cfg="identidade.etapas.numero"></span><i></i><span data-cfg="identidade.etapas.rotulo"></span></p>
              <h2 class="stage__title" id="stage-title" data-cfg="identidade.etapas.titulo"></h2>
              <ol class="stage__steps" id="stage-steps"></ol>
            </div>
            <figure class="stage__fallback" aria-hidden="true">
              <img src="%HERO_IMG%" width="600" height="600" alt="" loading="lazy" decoding="async" />
            </figure>
          </div>
        </div>
      </section>

      <!-- CENA 4 — Cardápio -->
      <section class="menu" id="cardapio" aria-labelledby="menu-title">
        <div class="container">
          <header class="section-head">
            <p class="kicker"><span data-cfg="identidade.cardapio.numero"></span><i></i><span data-cfg="identidade.cardapio.rotulo"></span></p>
            <h2 class="section-title" id="menu-title" data-cfg="identidade.cardapio.titulo"></h2>
            <p class="menu__note" data-cfg="identidade.cardapio.aviso"></p>
          </header>
          <div class="filters" id="menu-filters" role="group" aria-label="Filtrar por categoria"></div>
          <p class="sr-only" id="menu-status" role="status" aria-live="polite"></p>
          <ul class="grid" id="menu-grid" aria-label="Pizzas"></ul>
          <p class="menu__empty" id="menu-empty" hidden></p>
        </div>
      </section>

      <!-- CENA 5 — A casa -->
      <section class="story" id="casa" aria-labelledby="story-title">
        <div class="container story__inner">
          <figure class="story__frame" id="story-frame" data-reveal>
            <img id="story-img" alt="" width="900" height="1100" loading="lazy" decoding="async" hidden />
            <img class="story__mark" src="%LOGO%" alt="" width="200" height="200" loading="lazy" />
          </figure>
          <div class="story__copy" data-reveal>
            <p class="kicker"><span data-cfg="identidade.historia.numero"></span><i></i><span data-cfg="identidade.historia.rotulo"></span></p>
            <h2 class="section-title" id="story-title" data-cfg="identidade.historia.titulo"></h2>
            <div id="story-text"></div>
            <p class="story__sign" data-cfg="identidade.historia.assinatura"></p>
            <ul class="story__facts" id="story-facts"></ul>
          </div>
        </div>
      </section>

      <!-- CENA 6 — Pedido -->
      <section class="order" id="pedido" aria-labelledby="order-title">
        <div class="container order__inner">
          <div class="order__cta" data-reveal>
            <p class="kicker"><span data-cfg="identidade.final.numero"></span><i></i><span data-cfg="identidade.final.rotulo"></span></p>
            <h2 class="order__title" id="order-title" data-cfg="identidade.final.titulo"></h2>
            <p class="order__text" data-cfg="identidade.final.texto"></p>
            <a class="btn btn--gold btn--lg" data-order data-order-main href="#pedido" data-cfg="identidade.final.botao"></a>
            <p class="order__off" id="order-off" hidden></p>
          </div>
          <div class="order__info" data-reveal>
            <h3 class="info-title">Endereço</h3>
            <p id="info-address"></p>
            <h3 class="info-title">Horários</h3>
            <dl class="hours" id="info-hours"></dl>
            <h3 class="info-title" id="social-title" hidden>Redes</h3>
            <ul class="social" id="info-social" aria-labelledby="social-title"></ul>
            <ul class="extras" id="info-extras"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner">
        <span class="footer__brand"><span data-cfg="identidade.nome"></span> · <span data-cfg="identidade.slogan"></span></span>
        <span class="footer__note" data-cfg="identidade.rodape"></span>
      </div>
    </footer>

    <a class="fab" id="fab" data-order href="#pedido" aria-label="Pedir pelo WhatsApp" hidden>
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M4 3h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-5 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span>Pedir</span>
    </a>

    <noscript>
      <p class="noscript">Para ver o cardápio, ative o JavaScript do navegador ou peça diretamente pelo WhatsApp da casa.</p>
    </noscript>
  </body>
</html>
